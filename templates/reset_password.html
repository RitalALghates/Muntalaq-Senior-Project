{% extends "base.html" %}
{% block title %}{{ t('page_reset_title') }} - {% if current_lang == 'en' %}Muntalaq{% else %}منطلق{% endif %}{% endblock %}
{% block content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; background: linear-gradient(135deg, #F0F9FF, #E0F2FE);">
  <div class="card" style="max-width: 440px; width: 100%; padding: 40px;">
    <div style="text-align: center; margin-bottom: 32px;">
      <div style="font-size: 56px; margin-bottom: 16px;">🔑</div>
      <h1 style="font-size: 28px; font-weight: 800; margin-bottom: 8px;">{{ t('reset_title') }}</h1>
      <p style="color: #64748B;">{{ t('reset_subtitle') }}</p>
    </div>

    <form method="POST" action="{{ url_for('reset_password', token=token) }}">
      <div style="margin-bottom: 16px;">
        <label style="display: block; font-weight: 600; margin-bottom: 8px;">{{ t('new_password_label') }}</label>
        <input type="password" name="password" required minlength="6"
               style="width: 100%; padding: 14px; border: 2px solid #E2E8F0; border-radius: 10px; font-family: Cairo, sans-serif;"
               placeholder="{{ t('enter_strong_password') }}">
        <p style="font-size:12px; color:#64748B; margin-top:6px;">{{ t('password_rules_inline') }}</p>
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display: block; font-weight: 600; margin-bottom: 8px;">{{ t('confirm_password_label') }}</label>
        <input type="password" name="confirm_password" required minlength="6"
               style="width: 100%; padding: 14px; border: 2px solid #E2E8F0; border-radius: 10px; font-family: Cairo, sans-serif;"
               placeholder="{{ t('reenter_password') }}">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 16px;">
        {{ t('update_password_btn') }}
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px;">
      <a href="{{ url_for('login') }}" style="color: #0891B2; text-decoration: none; font-weight: 600;">{{ t('back_to_login') }}</a>
    </div>
  </div>
</div>
{% endblock %}
